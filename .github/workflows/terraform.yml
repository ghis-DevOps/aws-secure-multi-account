name: Terraform

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  id-token: write
  contents: read

concurrency:
  group: terraform-${{ github.ref }}
  cancel-in-progress: false

env:
  AWS_REGION: us-east-1
  TF_VAR_aws_region: us-east-1
  TF_VAR_allowed_regions: '["us-east-1", "us-west-2"]'
  TF_VAR_create_member_accounts: 'false'
  TF_VAR_root_email: ${{ secrets.TF_ROOT_EMAIL }}
  TF_VAR_log_archive_email: ${{ secrets.TF_LOG_ARCHIVE_EMAIL }}
  TF_VAR_security_tooling_email: ${{ secrets.TF_SECURITY_TOOLING_EMAIL }}
  TF_VAR_shared_services_email: ${{ secrets.TF_SHARED_SERVICES_EMAIL }}
  TF_VAR_prod_workload_email: ${{ secrets.TF_PROD_WORKLOAD_EMAIL }}
  TF_VAR_dev_workload_email: ${{ secrets.TF_DEV_WORKLOAD_EMAIL }}

jobs:
  terraform:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.16.1

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_TO_ASSUME }}
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: GitHubActionsTerraform

      - name: Terraform init
        run: terraform init -reconfigure

      - name: Terraform format check
        run: terraform fmt -check -recursive

      - name: Terraform validate
        run: terraform validate

      - name: Terraform plan
        if: github.event_name == 'pull_request'
        run: terraform plan -no-color

      - name: Terraform apply
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: terraform apply -auto-approve -no-color
