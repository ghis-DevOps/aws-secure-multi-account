<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AURA | Curated Modern Essentials</title>
  <style>
    /* CSS Variables & Global Styles */
    :root {
      --bg-primary: #f8f9fa;
      --bg-card: #ffffff;
      --text-dark: #121212;
      --text-muted: #6c757d;
      --accent-color: #2b2d42;
      --highlight-color: #d90429;
      --border-color: #e9ecef;
      --shadow-sm: 0 2px 8px rgba(0,0,0,0.06);
      --shadow-md: 0 8px 24px rgba(0,0,0,0.1);
      --font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: var(--font-family);
      background-color: var(--bg-primary);
      color: var(--text-dark);
      line-height: 1.6;
    }

    /* Navigation */
    header {
      position: sticky;
      top: 0;
      background: rgba(255, 255, 255, 0.95);
      backdrop-filter: blur(8px);
      border-bottom: 1px solid var(--border-color);
      z-index: 100;
    }

    .nav-container {
      max-width: 1200px;
      margin: 0 auto;
      padding: 1.2rem 2rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .logo {
      font-size: 1.5rem;
      font-weight: 800;
      letter-spacing: 2px;
      color: var(--accent-color);
    }

    .cart-btn {
      background: none;
      border: none;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 0.5rem;
      color: var(--accent-color);
      padding: 0.5rem 1rem;
      border-radius: 20px;
      background-color: var(--bg-primary);
      transition: background 0.2s ease;
    }

    .cart-btn:hover {
      background-color: #e2e8f0;
    }

    .cart-badge {
      background: var(--highlight-color);
      color: white;
      font-size: 0.8rem;
      padding: 0.1rem 0.5rem;
      border-radius: 12px;
    }

    /* Hero Section */
    .hero {
      text-align: center;
      padding: 5rem 1rem 3rem 1rem;
      background: linear-gradient(180deg, #ffffff 0%, var(--bg-primary) 100%);
    }

    .hero h1 {
      font-size: 2.8rem;
      font-weight: 800;
      color: var(--accent-color);
      margin-bottom: 1rem;
    }

    .hero p {
      font-size: 1.2rem;
      color: var(--text-muted);
      max-width: 600px;
      margin: 0 auto;
    }

    /* Product Grid */
    .products-container {
      max-width: 1200px;
      margin: 2rem auto 5rem auto;
      padding: 0 2rem;
    }

    .section-title {
      font-size: 1.8rem;
      margin-bottom: 2rem;
      text-align: center;
    }

    .product-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
      gap: 2rem;
    }

    .product-card {
      background: var(--bg-card);
      border-radius: 12px;
      overflow: hidden;
      box-shadow: var(--shadow-sm);
      transition: transform 0.3s ease, box-shadow 0.3s ease;
      display: flex;
      flex-direction: column;
    }

    .product-card:hover {
      transform: translateY(-6px);
      box-shadow: var(--shadow-md);
    }

    .product-image {
      width: 100%;
      height: 240px;
      object-fit: cover;
      background-color: #eee;
    }

    .product-info {
      padding: 1.5rem;
      display: flex;
      flex-direction: column;
      flex-grow: 1;
    }

    .category-tag {
      font-size: 0.75rem;
      text-transform: uppercase;
      letter-spacing: 1px;
      color: var(--text-muted);
      font-weight: 700;
      margin-bottom: 0.5rem;
    }

    .product-title {
      font-size: 1.2rem;
      font-weight: 700;
      margin-bottom: 0.5rem;
      color: var(--accent-color);
    }

    .product-description {
      font-size: 0.9rem;
      color: var(--text-muted);
      margin-bottom: 1.5rem;
      flex-grow: 1;
    }

    .product-bottom {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .product-price {
      font-size: 1.25rem;
      font-weight: 800;
      color: var(--accent-color);
    }

    .add-to-cart-btn {
      background: var(--accent-color);
      color: white;
      border: none;
      padding: 0.6rem 1.2rem;
      border-radius: 6px;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s ease;
    }

    .add-to-cart-btn:hover {
      background: #3d405b;
    }

    /* Cart Sidebar Drawer */
    .cart-drawer {
      position: fixed;
      top: 0;
      right: -400px;
      width: 380px;
      height: 100vh;
      background: white;
      box-shadow: var(--shadow-md);
      z-index: 200;
      transition: right 0.3s ease;
      display: flex;
      flex-direction: column;
    }

    .cart-drawer.open {
      right: 0;
    }

    .cart-header {
      padding: 1.5rem;
      border-bottom: 1px solid var(--border-color);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .close-cart {
      background: none;
      border: none;
      font-size: 1.5rem;
      cursor: pointer;
      color: var(--text-muted);
    }

    .cart-items {
      padding: 1.5rem;
      flex-grow: 1;
      overflow-y: auto;
    }

    .cart-item {
      display: flex;
      justify-content: space-between;
      margin-bottom: 1rem;
      padding-bottom: 1rem;
      border-bottom: 1px solid var(--border-color);
    }

    .cart-footer {
      padding: 1.5rem;
      border-top: 1px solid var(--border-color);
    }

    .cart-total {
      display: flex;
      justify-content: space-between;
      font-size: 1.2rem;
      font-weight: 800;
      margin-bottom: 1rem;
    }

    .checkout-btn {
      width: 100%;
      background: var(--highlight-color);
      color: white;
      border: none;
      padding: 0.8rem;
      border-radius: 6px;
      font-size: 1rem;
      font-weight: 700;
      cursor: pointer;
    }

    .overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background: rgba(0,0,0,0.4);
      z-index: 150;
      display: none;
    }

    .overlay.show {
      display: block;
    }
  </style>
</head>
<body>

  <!-- Navigation -->
  <header>
    <div class="nav-container">
      <div class="logo">AURA</div>
      <button class="cart-btn" id="cartToggle">
        🛒 Cart <span class="cart-badge" id="cartCount">0</span>
      </button>
    </div>
  </header>

  <!-- Hero Section -->
  <section class="hero">
    <h1>Elevate Everyday Living</h1>
    <p>Discover our minimal collection of 05 premium essentials designed for style, comfort, and function.</p>
  </section>

  <!-- Product Catalog -->
  <section class="products-container">
    <h2 class="section-title">Featured Collection</h2>
    <div class="product-grid" id="productGrid">
      <!-- Dynamic Products Loaded via JavaScript -->
    </div>
  </section>

  <!-- Cart Drawer -->
  <div class="overlay" id="overlay"></div>
  <div class="cart-drawer" id="cartDrawer">
    <div class="cart-header">
      <h3>Your Cart</h3>
      <button class="close-cart" id="closeCart">&times;</button>
    </div>
    <div class="cart-items" id="cartItems">
      <p style="color: var(--text-muted); text-align: center;">Your cart is empty.</p>
    </div>
    <div class="cart-footer">
      <div class="cart-total">
        <span>Total:</span>
        <span id="cartTotal">$0.00</span>
      </div>
      <button class="checkout-btn" onclick="alert('Proceeding to checkout!')">Checkout</button>
    </div>
  </div>

  <!-- JavaScript Logic -->
  <script>
    // 05 Item Varieties Dataset
    const products = [
      {
        id: 1,
        title: "Acoustic Noise-Canceling Headphones",
        category: "Electronics",
        price: 249.99,
        description: "Studio-quality sound with custom active noise cancellation and 30-hour battery life.",
        image: "https://images.unsplash.com/photo-1505740420928-5e560c06d30e?auto=format&fit=crop&w=600&q=80"
      },
      {
        id: 2,
        title: "Minimalist Chronograph Watch",
        category: "Accessories",
        price: 129.50,
        description: "Sleek stainless steel case featuring genuine Italian leather straps and precision movement.",
        image: "https://images.unsplash.com/photo-1523275335684-37898b6baf30?auto=format&fit=crop&w=600&q=80"
      },
      {
        id: 3,
        title: "Organic Cotton Daily Tote",
        category: "Fashion",
        price: 45.00,
        description: "Heavy-duty canvas tote with interior pocket partitions, built for work and travel.",
        image: "https://images.unsplash.com/photo-1544816155-12df9643f363?auto=format&fit=crop&w=600&q=80"
      },
      {
        id: 4,
        title: "Ceramic Specialty Pour-Over Set",
        category: "Home & Kitchen",
        price: 68.00,
        description: "Handmade matte ceramic dripper and heat-resistant glass carafe for precise brewing.",
        image: "https://images.unsplash.com/photo-1514432324607-a09d9b4aefdd?auto=format&fit=crop&w=600&q=80"
      },
      {
        id: 5,
        title: "Natural Soy Wax Candle",
        category: "Lifestyle",
        price: 28.00,
        description: "Hand-poured candle infused with wild cedar, amber, and subtle botanical oils.",
        image: "https://images.unsplash.com/photo-1603006905003-be475563bc59?auto=format&fit=crop&w=600&q=80"
      }
    ];

    let cart = [];

    // Render Product Cards
    const productGrid = document.getElementById('productGrid');
    
    function renderProducts() {
      productGrid.innerHTML = products.map(product => `
        <div class="product-card">
          <img src="${product.image}" alt="${product.title}" class="product-image">
          <div class="product-info">
            <span class="category-tag">${product.category}</span>
            <h3 class="product-title">${product.title}</h3>
            <p class="product-description">${product.description}</p>
            <div class="product-bottom">
              <span class="product-price">$${product.price.toFixed(2)}</span>
              <button class="add-to-cart-btn" onclick="addToCart(${product.id})">Add to Cart</button>
            </div>
          </div>
        </div>
      `).join('');
    }

    // Cart Interactions
    function addToCart(productId) {
      const product = products.find(p => p.id === productId);
      const existingItem = cart.find(item => item.id === productId);

      if (existingItem) {
        existingItem.quantity += 1;
      } else {
        cart.push({ ...product, quantity: 1 });
      }

      updateCartUI();
      openCart();
    }

    function updateCartUI() {
      const cartItemsContainer = document.getElementById('cartItems');
      const cartCount = document.getElementById('cartCount');
      const cartTotal = document.getElementById('cartTotal');

      // Update badge count
      const totalItems = cart.reduce((sum, item) => sum + item.quantity, 0);
      cartCount.textContent = totalItems;

      // Update cart list
      if (cart.length === 0) {
        cartItemsContainer.innerHTML = `<p style="color: var(--text-muted); text-align: center;">Your cart is empty.</p>`;
      } else {
        cartItemsContainer.innerHTML = cart.map(item => `
          <div class="cart-item">
            <div>
              <strong>${item.title}</strong>
              <div style="color: var(--text-muted); font-size: 0.85rem;">
                $${item.price.toFixed(2)} x ${item.quantity}
              </div>
            </div>
            <strong>$${(item.price * item.quantity).toFixed(2)}</strong>
          </div>
        `).join('');
      }

      // Update Total Price
      const totalCost = cart.reduce((sum, item) => sum + (item.price * item.quantity), 0);
      cartTotal.textContent = `$${totalCost.toFixed(2)}`;
    }

    // Drawer Controls
    const cartDrawer = document.getElementById('cartDrawer');
    const overlay = document.getElementById('overlay');
    
    function openCart() {
      cartDrawer.classList.add('open');
      overlay.classList.add('show');
    }

    function closeCart() {
      cartDrawer.classList.remove('open');
      overlay.classList.remove('show');
    }

    document.getElementById('cartToggle').addEventListener('click', openCart);
    document.getElementById('closeCart').addEventListener('click', closeCart);
    overlay.addEventListener('click', closeCart);

    // Initial Load
    renderProducts();
  </script>
</body>
</html>
