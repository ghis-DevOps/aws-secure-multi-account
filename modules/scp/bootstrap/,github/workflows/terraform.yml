name: "Terraform Deployment Pipeline"

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

# Required for AWS OIDC authentication
permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: "us-east-1"
  AWS_ROLE_TO_ASSUME_ARN: "arn:aws:iam::277869548641:role/github-actions-terraform-runner-landing-zone"
  ROLE_TO_ASSUME: ${{ secrets.AWS_ROLE_TO_ASSUME }}
  STATE_BUCKET: "org-tfstate-landing-zone-management"
  STATE_KEY: "landing-zone/terraform.tfstate"

jobs:
  terraform:
    name: "Terraform Plan & Apply"
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.6.0"
          terraform_wrapper: false # Fixes deprecated set-output wrapper issues

      # Authenticate to AWS via OIDC Role Assumption
      - name: Configure AWS Credentials from Management Role
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.ROLE_TO_ASSUME || env.AWS_ROLE_TO_ASSUME_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: GitHubActionsTerraformSession

      - name: Verify AWS identity
        run: aws sts get-caller-identity

      - name: Terraform Init
        env:
          KMS_KEY_ARN: ${{ secrets.KMS_KEY_ARN }}
        run: |
          terraform init \
            -backend-config="bucket=${STATE_BUCKET}" \
            -backend-config="key=${STATE_KEY}" \
            -backend-config="region=${AWS_REGION}" \
            -backend-config="encrypt=true" \
            -backend-config="kms_key_id=${KMS_KEY_ARN}"

      - name: Terraform Format Check
        run: terraform fmt -check

      - name: Terraform Validate
        run: terraform validate

      - name: Terraform Plan
        run: terraform plan -no-color

      - name: Terraform Apply
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        run: terraform apply -auto-approve -no-color